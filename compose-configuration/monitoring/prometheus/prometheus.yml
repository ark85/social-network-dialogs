global:
  scrape_interval: 1s
  scrape_timeout: 800ms
  evaluation_interval: 1s
  external_labels:
    monitor: social_network

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["prometheus:9090"]

  - job_name: social-network-dialogs-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["social-network-dialogs-backend:8080"]
