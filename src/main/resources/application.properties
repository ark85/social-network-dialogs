spring.application.name=social-network-dialogs

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.liquibase.enabled=false

tarantool.host=${TARANTOOL_HOST}
tarantool.port=${TARANTOOL_PORT}
tarantool.username=${TARANTOOL_USERNAME}
tarantool.password=${TARANTOOL_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL}

social-network.import.batch-size=${SOCIAL_NETWORK_IMPORT_BATCH_SIZE:10000}

logging.level.io.github.ark85.study.socialnetworkdialogs=DEBUG
