spring.application.name=social-network-dialogs

spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

spring.liquibase.enabled=false

tarantool.host=${TARANTOOL_HOST}
tarantool.port=${TARANTOOL_PORT}
tarantool.username=${TARANTOOL_USERNAME}
tarantool.password=${TARANTOOL_PASSWORD}

jwt.secret=${JWT_SECRET}
jwt.access-token-ttl=${JWT_ACCESS_TOKEN_TTL}

social-network.import.batch-size=${SOCIAL_NETWORK_IMPORT_BATCH_SIZE:10000}

management.endpoints.web.exposure.include=health,prometheus,metrics
management.endpoint.health.probes.enabled=true
management.metrics.tags.application=${spring.application.name}
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

logging.level.io.github.ark85.study.socialnetworkdialogs=DEBUG
logging.pattern.level=%5p [requestId=%X{requestId:-}]
