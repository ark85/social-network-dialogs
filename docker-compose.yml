services:
  tarantool:
    build: ./compose-configuration/tarantool
    entrypoint: ["sh", "/opt/tarantool/entrypoint.sh"]
    command: ["/opt/tarantool/init.lua"]
    environment:
      TARANTOOL_USERNAME: ${TARANTOOL_USERNAME}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD}
      SOCIAL_NETWORK_DB_NAME: ${SOCIAL_NETWORK_DB_NAME}
      SOCIAL_NETWORK_DB_USERNAME: ${SOCIAL_NETWORK_DB_USERNAME}
      SOCIAL_NETWORK_DB_PASSWORD: ${SOCIAL_NETWORK_DB_PASSWORD}
    volumes:
      - ./compose-configuration/tarantool/entrypoint.sh:/opt/tarantool/entrypoint.sh:ro
      - ./compose-configuration/tarantool/init.lua:/opt/tarantool/init.lua:ro
      - ./compose-configuration/tarantool/schema.lua:/opt/tarantool/schema.lua:ro
      - ./compose-configuration/tarantool/import_dialogs.lua:/opt/tarantool/import_dialogs.lua:ro
      - tarantool_data:/var/lib/tarantool
    networks:
      - social_network
    ports:
      - "3301:3301"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/3301'"]
      interval: 5s
      timeout: 5s
      retries: 10

  social-network-dialogs-backend:
    build:
      context: .
      dockerfile: Dockerfile

    ports:
      - "8081:8080"

    expose:
      - 8081

    environment:
      TARANTOOL_HOST: tarantool
      TARANTOOL_PORT: 3301
      TARANTOOL_USERNAME: ${TARANTOOL_USERNAME}
      TARANTOOL_PASSWORD: ${TARANTOOL_PASSWORD}

      JWT_SECRET: ${JWT_SECRET}
      JWT_ACCESS_TOKEN_TTL: ${JWT_ACCESS_TOKEN_TTL}

    depends_on:
      tarantool:
        condition: service_healthy

    networks:
      - social_network
      - dialogs

    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://social-network-dialogs-backend:8080/api/health-check/ping || exit 1" ]
      interval: 5s
      timeout: 5s
      retries: 10

  # ----------- monitoring start -------------

  zabbix-postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZABBIX_USERNAME}
      POSTGRES_PASSWORD: ${ZABBIX_PASSWORD}
      POSTGRES_DB: zabbix
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix -d zabbix"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - social_network

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: ${ZABBIX_USERNAME}
      POSTGRES_PASSWORD: ${ZABBIX_PASSWORD}
      POSTGRES_DB: zabbix
    ports:
      - 10051:10051
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    networks:
      - social_network

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_SERVER_HOST: zabbix-server
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: ${ZABBIX_USERNAME}
      POSTGRES_PASSWORD: ${ZABBIX_PASSWORD}
      POSTGRES_DB: zabbix
    ports:
      - 8082:8080
    depends_on:
      zabbix-postgres:
        condition: service_healthy
      zabbix-server:
        condition: service_started
    networks:
      - social_network
  zabbix-agent:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    restart: unless-stopped
    user: root
    environment:
      ZBX_HOSTNAME: social-network-dialogs-backend
      ZBX_SERVER_HOST: zabbix-server
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - zabbix-server
    networks:
      - social_network

  prometheus:
    image: prom/prometheus:latest
    restart: unless-stopped
    volumes:
      - ./compose-configuration/monitoring/prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    expose:
      - 9090
    ports:
      - 9090:9090
    depends_on:
      - social-network-dialogs-backend
    networks:
      - social_network

  grafana:
    image: grafana/grafana:11.5.2
    restart: unless-stopped
    depends_on:
      - prometheus
    volumes:
      - grafana_data:/var/lib/grafana
      - ./compose-configuration/monitoring/grafana/provisioning:/etc/grafana/provisioning
    environment:
      GF_SECURITY_DISABLE_INITIAL_ADMIN_CREATION: "true"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_SIGNOUT_MENU: "true"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_DASHBOARDS_MIN_REFRESH_INTERVAL: 1s
    networks:
      - social_network
    ports:
      - 3000:3000

  # ----------- monitoring end -------------

volumes:
  tarantool_data:
  zabbix_postgres_data:
  prometheus_data:
  grafana_data:

networks:
  social_network:
  dialogs:
    external: true
    name: dialogs
